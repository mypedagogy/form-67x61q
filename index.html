<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow, noarchive">
<title>AID 역량진단 설문</title>
<style>
  :root{
    --bg:#f3f5f8; --card:#fff; --ink:#1b2430; --sub:#5b6676; --line:#d5dbe3;
    --main:#1f4e8c; --main-dark:#173c6c; --main-soft:#e8eef7; --warn:#c62828; --warn-soft:#fdeeee; --ok:#2e7d32;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:17px;line-height:1.6;-webkit-text-size-adjust:100%;word-break:keep-all}
  .wrap{max-width:640px;margin:0 auto;padding:16px 16px 120px}
  header.top{background:var(--main);color:#fff}
  header.top .in{max-width:640px;margin:0 auto;padding:14px 16px}
  header.top h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-0.2px}
  .testbar{background:#fff4d6;color:#7a5600;font-size:14px;text-align:center;padding:6px 10px}
  .progress{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px}
  .progress .bar{height:8px;background:#dfe4ea;border-radius:99px;overflow:hidden}
  .progress .fill{height:100%;background:var(--main);width:0;transition:width .25s}
  .progress .txt{font-size:13px;color:var(--sub);margin-top:4px;text-align:right}
  .card{background:var(--card);border-radius:14px;padding:20px 18px;margin:0 0 14px;box-shadow:0 1px 2px rgba(20,30,50,.06)}
  h2{font-size:20px;margin:0 0 12px;letter-spacing:-0.3px}
  p{margin:0 0 10px}
  .muted{color:var(--sub);font-size:15px}
  .note{background:var(--main-soft);border-radius:10px;padding:12px 14px;font-size:15px;margin:10px 0}
  .choice{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 10px;font-size:17px;color:var(--ink);cursor:pointer;font-family:inherit}
  .choice small{display:block;color:var(--sub);font-size:14px;margin-top:2px}
  .choice[aria-pressed="true"]{border-color:var(--main);background:var(--main-soft);box-shadow:inset 0 0 0 1px var(--main);font-weight:700}
  .btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 20px;border-radius:12px;border:0;font-size:17px;font-weight:700;cursor:pointer;font-family:inherit}
  .btn.primary{background:var(--main);color:#fff}
  .btn.primary:disabled{background:#9fb0c7;cursor:not-allowed}
  .btn.ghost{background:#fff;color:var(--main);border:1.5px solid var(--main)}
  .btn.block{width:100%}
  .nav{position:fixed;left:0;right:0;bottom:0;background:rgba(243,245,248,.96);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
  .nav .in{max-width:640px;margin:0 auto;display:flex;gap:10px}
  .nav .btn{flex:1}
  .nav .btn.ghost{flex:0 0 32%}
  label.field{display:block;font-weight:700;margin:0 0 6px}
  input.text{width:100%;font-size:19px;padding:14px;border:1.5px solid var(--line);border-radius:12px;font-family:inherit}
  input.text:focus{outline:none;border-color:var(--main);box-shadow:0 0 0 3px var(--main-soft)}
  .err{color:var(--warn);font-size:15px;margin-top:8px;min-height:1em}
  .consent-box{border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:15px;background:#fafbfc}
  .consent-box ul{margin:0;padding-left:18px}
  .consent-box li{margin:0 0 6px}
  .guide-list{margin:0;padding-left:20px}
  .guide-list li{margin:0 0 8px}
  /* 문항 */
  .item{background:var(--card);border-radius:14px;padding:16px 14px 14px;margin:0 0 12px;border:1.5px solid transparent;box-shadow:0 1px 2px rgba(20,30,50,.06)}
  .item.missing{border-color:var(--warn);background:var(--warn-soft)}
  .item .q{font-size:17px;font-weight:600;margin:0 0 12px;line-height:1.55}
  .scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;border:0;padding:0;margin:0}
  .scale legend{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .scale input{position:absolute;opacity:0;pointer-events:none}
  .scale label{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;min-height:72px;padding:8px 2px 6px;border:1.5px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;text-align:center;user-select:none;-webkit-tap-highlight-color:transparent}
  .scale label b{font-size:19px;line-height:1.2}
  .scale label span{font-size:11.5px;line-height:1.25;color:var(--sub);margin-top:4px}
  .scale input:checked + label{background:var(--main);border-color:var(--main);color:#fff}
  .scale input:checked + label span{color:#e6edf7}
  .scale input:focus-visible + label{outline:3px solid #f0b400;outline-offset:1px}
  .page-msg{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:15px;margin:0 0 12px;font-weight:600}
  .center{text-align:center}
  .done-icon{font-size:44px;line-height:1;margin:6px 0 10px;color:var(--ok)}
  .row2{display:flex;gap:10px}
  .row2 .btn{flex:1}
  .spinner{display:inline-block;width:18px;height:18px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp 0.8s linear infinite;margin-right:8px}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (min-width:560px){ .scale label span{font-size:12.5px} }
</style>
</head>
<body>
<header class="top"><div class="in"><h1>AID 역량진단 설문</h1></div></header>
<div id="testbar" class="testbar" hidden>테스트 모드: 응답이 저장되지 않습니다 (SCRIPT_URL 미설정)</div>
<main class="wrap" id="app"><div class="card">불러오는 중입니다…</div></main>
<nav class="nav" id="nav" hidden><div class="in" id="navIn"></div></nav>

<script>
/* =====================================================================
   설정: 배포 전에 여기만 바꾸면 됩니다.
   ===================================================================== */
const CONFIG = {
  // 구글 앱스 스크립트 웹 앱 주소(https://script.google.com/macros/s/..../exec)
  // 비워 두면 '테스트 모드'로 동작하며 응답이 저장되지 않습니다.
  SCRIPT_URL: "https://script.google.com/macros/s/AKfycbx5FMIHFv3bkqBru3LFXHQAUGLbVbpw5w5Lhs7MHbS__Tf1zLiOVar8-ZavGxBgsNXh/exec",
  // 공개용 문항 파일(역량명·하위역량·수준 정보 없음). 원본 aid_items.json은 올리지 않음
  ITEMS_URL: "survey_data.json",
  // 개인정보 동의 화면 맨 아래 문의처: 응답자가 고른 학교의 문구가 보임
  // 1차년도: 3개교 모두 연성대 대표 담당자. 2차년도에 학교별 담당자가 정해지면 해당 줄만 바꿈
  CONTACTS: {
    yeonsung: "문의: 연성대학교 김미영 교수 (mykim@yeonsung.ac.kr)",
    inha:     "문의: 연성대학교 김미영 교수 (mykim@yeonsung.ac.kr)",
    dongyang: "문의: 연성대학교 김미영 교수 (mykim@yeonsung.ac.kr)"
  },
  SCHOOLS: [
    { code: "yeonsung", name: "연성대학교" },
    { code: "inha",     name: "인하공업전문대학" },
    { code: "dongyang", name: "동양미래대학교" }
  ],
  // 응답자 유형 화면에 보이는 이름과 설명(키는 aid_items.json의 respondent_types와 같아야 함)
  TYPE_LABELS: {
    "학생_AI기초": ["학생", "AI 기초 교양 수업에서 응답"],
    "학생_XAI":    ["학생", "X+AI 전공 교과 수업에서 응답"],
    "지역주민":    ["지역주민", ""],
    "재직자":      ["재직자", "기업·기관에 재직 중인 성인학습자"],
    "교원":        ["교원", ""],
    "직원":        ["직원", ""]
  },
  STORAGE_KEY: "aid_survey_inprogress_v1",
  ITEMS_PER_PAGE_MAX: 8,          // 한 화면 문항 수(6~9 범위 안에서 고르게 나눔)
  RETRY_DELAYS_MS: [1500, 3000, 6000] // 자동 재시도 3회
};

/* 저장 열 순서(고정) */
const BASE_COLS = ["response_id","started_at","submitted_at","duration_sec","page_seconds","school","respondent_type","text_version","id_number","phone","consent","l5_opt_in"];

/* ===================================================================== */
let DATA = null;           // aid_items.json
let ITEM_BY_MODULE = {};   // module -> items[]
let ALL_ITEM_IDS = [];
let state = null;
let pageEnteredAt = null;  // 현재 문항 화면에 들어온 시각
let submitting = false;
let pageMessage = "";

const $app = document.getElementById("app");
const $nav = document.getElementById("nav");
const $navIn = document.getElementById("navIn");

function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)){
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "html") el.innerHTML = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()){
    if (k === null || k === undefined || k === false) continue;
    el.appendChild(typeof k === "string" ? document.createTextNode(k) : k);
  }
  return el;
}

function newState(){
  return { v:1, step:"start", school:null, consent:null, type:null, idNumber:"", phone:"",
           answers:{}, pos:0, l5:null, startedAt:null, pageMs:{}, responseId:makeId() };
}
function makeId(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "r-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,10);
}
function save(){
  try { localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(state)); } catch(e){}
}
function loadSaved(){
  try { const s = JSON.parse(localStorage.getItem(CONFIG.STORAGE_KEY) || "null"); return (s && s.v === 1) ? s : null; } catch(e){ return null; }
}
function clearSaved(){ try { localStorage.removeItem(CONFIG.STORAGE_KEY); } catch(e){} }

function kst(ms){ return new Date(ms).toLocaleString("sv-SE", { timeZone:"Asia/Seoul" }); }
function schoolName(code){ const s = CONFIG.SCHOOLS.find(x=>x.code===code); return s ? s.name : ""; }
function typeInfo(){ return DATA.respondent_types[state.type]; }
function textVersion(){ return typeInfo().text_version; }
function idKind(){
  if (!state.type) return null;
  if (state.type.startsWith("학생")) return "student";
  if (state.type === "교원" || state.type === "직원") return "staff";
  return "phone";
}

/* 문항 화면 나누기: 모듈별로 고르게 */
function splitPages(module){
  const items = ITEM_BY_MODULE[module];
  const n = Math.ceil(items.length / CONFIG.ITEMS_PER_PAGE_MAX);
  const pages = []; let start = 0;
  for (let i=0;i<n;i++){
    const size = Math.floor(items.length/n) + (i < items.length % n ? 1 : 0);
    pages.push({ kind:"items", module, key: module + "-" + (i+1), items: items.slice(start, start+size) });
    start += size;
  }
  return pages;
}
/* 현재 응답자의 화면 순서 */
function buildFlow(){
  const t = typeInfo(); let flow = [];
  t.modules.forEach(m => flow = flow.concat(splitPages(m)));
  if (t.optional_modules && t.optional_modules.length){
    flow.push({ kind:"optask" });
    if (state.l5 === "Y") t.optional_modules.forEach(m => flow = flow.concat(splitPages(m)));
  }
  return flow;
}
function activeModules(){
  const t = typeInfo(); const ms = t.modules.slice();
  if (state.l5 === "Y" && t.optional_modules) ms.push(...t.optional_modules);
  return ms;
}
function requiredIds(){
  return activeModules().flatMap(m => ITEM_BY_MODULE[m].map(i=>i.id));
}

/* ---------- 시간 기록 ---------- */
function enterPage(){ pageEnteredAt = Date.now(); }
function leavePage(){
  if (pageEnteredAt === null || state.step !== "items") { pageEnteredAt = null; return; }
  const p = buildFlow()[state.pos];
  if (p && p.kind === "items"){
    state.pageMs[p.key] = (state.pageMs[p.key] || 0) + (Date.now() - pageEnteredAt);
  }
  pageEnteredAt = null;
}
document.addEventListener("visibilitychange", () => {
  // 화면을 벗어난 시간은 빼고, 돌아오면 다시 잼
  if (document.hidden){ leavePage(); save(); }
  else if (state && state.step === "items") enterPage();
});

/* ---------- 이동 ---------- */
function go(step){
  leavePage();
  state.step = step; pageMessage = "";
  save(); render(); window.scrollTo(0,0);
}

/* ---------- 화면 그리기 ---------- */
function setNav(...buttons){
  $navIn.innerHTML = "";
  if (!buttons.length){ $nav.hidden = true; return; }
  buttons.forEach(b => $navIn.appendChild(b));
  $nav.hidden = false;
}
function render(){
  $app.innerHTML = "";
  ({ start:renderStart, consent:renderConsent, declined:renderDeclined, type:renderType,
     info:renderInfo, guide:renderGuide, items:renderItems, done:renderDone })[state.step]();
}

function renderStart(){
  const saved = loadSaved();
  const resumable = saved && !["start","done","declined"].includes(saved.step)
    && (!LOCK.school || saved.school === LOCK.school) && (!LOCK.type || saved.type === LOCK.type);
  if (resumable && !state._resumeAsked){
    $app.append(h("div",{class:"card"},
      h("h2",null,"이어서 응답하시겠어요?"),
      h("p",null,"이 기기에서 하던 응답이 남아 있습니다."),
      h("div",{class:"row2"},
        h("button",{class:"btn ghost",onclick:()=>{ clearSaved(); state = newState(); state._resumeAsked = true; applyUrlParams(); render(); }},"새로 시작"),
        h("button",{class:"btn primary",onclick:()=>{ state = saved; state._resumeAsked = true; render(); if (state.step==="items") enterPage(); }},"이어서 하기")
      )));
    setNav(); return;
  }
  const startBtn = h("button",{class:"btn primary block",disabled:!state.school,onclick:()=>{
    if (!state.school) return;
    if (!state.startedAt) state.startedAt = Date.now();
    go("consent");
  }},"시작하기");
  $app.append(
    h("div",{class:"card"},
      h("h2",null,"AI·디지털(AID) 역량진단에 참여해 주셔서 감사합니다"),
      h("p",null,"이 설문은 AI·디지털 기술을 활용하는 역량을 스스로 점검하는 진단입니다. 정답이 없으니 평소 자신의 모습대로 응답해 주세요."),
      h("p",{class:"muted"},"응답 시간은 약 10분입니다. (교원·직원은 약 20분)")
    ),
    h("div",{class:"card"},
      h("h2",null, LOCK.school ? "소속 학교를 확인해 주세요" : "소속 학교를 선택해 주세요"),
      ...CONFIG.SCHOOLS.filter(s => !LOCK.school || s.code === LOCK.school).map(s => h("button",{class:"choice","aria-pressed":String(state.school===s.code),
        onclick:()=>{ state.school = s.code; save(); render(); }}, s.name))
    )
  );
  setNav(startBtn);
}

function renderConsent(){
  const list = [
    ["수집 목적", "AID 역량진단 도구 개발과 교육 성과 분석"],
    ["수집 항목", "학교, 학번(학생) 또는 사번(교직원) 또는 휴대전화번호(지역주민·재직자), 설문 응답 내용"],
    ["학사 정보 연계(학생)", "학번으로 소속 학교의 학사 정보(학과·학년)를 연계해 분석할 수 있습니다."],
    ["보유 기간", "AID 전환 중점 전문대학 지원사업 2차년도 종료 시까지 보관하며, 종료 후 지체 없이 파기합니다."],
    ["처리 방법", "분석할 때 학번·사번 등은 가명 처리합니다."],
    ["동의 거부 권리", "동의를 거부할 권리가 있으며, 거부해도 불이익은 없습니다. 다만 동의하지 않으면 설문에 참여할 수 없습니다."]
  ];
  $app.append(h("div",{class:"card"},
    h("h2",null,"개인정보 수집·이용 동의"),
    h("div",{class:"consent-box"},
      h("ul",null, ...list.map(([k,v]) => h("li",null,h("b",null,k+": "),v))),
      h("p",{class:"muted",style:"margin:8px 0 0"},CONFIG.CONTACTS[state.school] || "")
    ),
    h("p",{style:"margin-top:14px;font-weight:700"},"위 내용에 동의하십니까?"),
    h("button",{class:"choice","aria-pressed":String(state.consent==="Y"),onclick:()=>{state.consent="Y";save();render();}},"동의합니다"),
    h("button",{class:"choice","aria-pressed":String(state.consent==="N"),onclick:()=>{state.consent="N";save();render();}},"동의하지 않습니다")
  ));
  setNav(
    h("button",{class:"btn ghost",onclick:()=>go("start")},"이전"),
    h("button",{class:"btn primary",disabled:!state.consent,onclick:()=>go(state.consent==="Y"?"type":"declined")},"다음")
  );
}

function renderDeclined(){
  $app.append(h("div",{class:"card center"},
    h("h2",null,"설문을 마칩니다"),
    h("p",null,"개인정보 수집·이용에 동의하지 않으셔서 설문에 참여하실 수 없습니다."),
    h("p",{class:"muted"},"관심 가져 주셔서 감사합니다.")
  ));
  setNav(
    h("button",{class:"btn ghost",onclick:()=>go("consent")},"이전"),
    h("button",{class:"btn primary",onclick:()=>{ clearSaved(); state = newState(); state._resumeAsked = true; render(); }},"처음 화면으로")
  );
}

function renderType(){
  const btn = (key) => {
    const [name, desc] = CONFIG.TYPE_LABELS[key] || [key,""];
    return h("button",{class:"choice","aria-pressed":String(state.type===key),onclick:()=>{
      if (state.type !== key){ state.type = key; state.answers = {}; state.pageMs = {}; state.pos = 0; state.l5 = null; state.idNumber=""; state.phone=""; }
      save(); render();
    }}, name, desc ? h("small",null,desc) : null);
  };
  const keys = Object.keys(DATA.respondent_types).filter(k => !LOCK.type || k === LOCK.type);
  const studentKeys = keys.filter(k=>k.startsWith("학생"));
  const otherKeys = keys.filter(k=>!k.startsWith("학생"));
  $app.append(h("div",{class:"card"},
    h("h2",null, LOCK.type ? "응답자 유형을 확인해 주세요" : "응답자 유형을 선택해 주세요"),
    ...studentKeys.map(btn),
    studentKeys.length ? h("div",{class:"note"},"두 과목을 모두 듣는 학생은 각 수업에서 한 번씩 응답해 주세요.") : null,
    ...otherKeys.map(btn)
  ));
  setNav(
    h("button",{class:"btn ghost",onclick:()=>go("consent")},"이전"),
    h("button",{class:"btn primary",disabled:!state.type,onclick:()=>go("info")},"다음")
  );
}

function renderInfo(){
  const kind = idKind();
  const isPhone = kind === "phone";
  const label = kind === "student" ? "학번" : kind === "staff" ? "사번" : "휴대전화번호";
  const help = isPhone ? "숫자만 입력해 주세요. (예: 01012345678)" : "숫자와 영문만 입력해 주세요.";
  const input = h("input",{class:"text",id:"idInput",autocomplete:"off",autocapitalize:"off",spellcheck:"false",
    inputmode: isPhone ? "numeric" : "text",
    value: isPhone ? state.phone : state.idNumber, placeholder: label + " 입력"});
  const err = h("div",{class:"err",id:"idErr"});
  input.addEventListener("input", () => {
    const cleaned = isPhone ? input.value.replace(/\D/g,"").slice(0,11) : input.value.replace(/[^A-Za-z0-9]/g,"");
    if (cleaned !== input.value) input.value = cleaned;
    if (isPhone) state.phone = cleaned; else state.idNumber = cleaned;
    err.textContent = ""; save();
  });
  const validate = () => {
    const v = input.value.trim();
    if (!v){ return label + "을(를) 입력해 주세요."; }
    if (isPhone && !/^010\d{8}$/.test(v)) return "010으로 시작하는 11자리 숫자로 입력해 주세요.";
    if (!isPhone && !/^[A-Za-z0-9]+$/.test(v)) return "숫자와 영문만 입력할 수 있습니다.";
    return "";
  };
  $app.append(h("div",{class:"card"},
    h("h2",null,"기본 정보"),
    h("label",{class:"field",for:"idInput"},label),
    input,
    h("p",{class:"muted",style:"margin-top:8px"},help),
    err
  ));
  setNav(
    h("button",{class:"btn ghost",onclick:()=>go("type")},"이전"),
    h("button",{class:"btn primary",onclick:()=>{ const m = validate(); if (m){ err.textContent = m; input.focus(); return; } go("guide"); }},"다음")
  );
}

function renderGuide(){
  $app.append(h("div",{class:"card"},
    h("h2",null,"응답 안내"),
    h("ol",{class:"guide-list"}, ...DATA.instructions.map(t=>h("li",null,t))),
    h("p",{class:"muted"},"모든 문항에 응답해야 다음 화면으로 넘어갈 수 있습니다.")
  ));
  setNav(
    h("button",{class:"btn ghost",onclick:()=>go("info")},"이전"),
    h("button",{class:"btn primary",onclick:()=>{ state.pos = Math.min(state.pos, buildFlow().length-1); go("items"); enterPage(); }},"응답 시작")
  );
}

function progressEl(){
  const ids = requiredIds();
  const done = ids.filter(id => state.answers[id]).length;
  const pct = ids.length ? Math.round(done/ids.length*100) : 0;
  return h("div",{class:"progress"},
    h("div",{class:"bar"},h("div",{class:"fill",style:"width:"+pct+"%"})),
    h("div",{class:"txt"},done + " / " + ids.length + " 문항 (" + pct + "%)"));
}

function renderItems(){
  const flow = buildFlow();
  if (state.pos >= flow.length) state.pos = flow.length - 1;
  const p = flow[state.pos];
  const isLast = state.pos === flow.length - 1;
  $app.append(progressEl());

  if (p.kind === "optask"){
    const n = (typeInfo().optional_modules||[]).reduce((s,m)=>s+ITEM_BY_MODULE[m].length,0);
    $app.append(h("div",{class:"card"},
      h("h2",null,"추가 문항"),
      h("p",null,"필수 문항 응답을 모두 마쳤습니다."),
      h("p",null,"추가 문항(" + n + "문항)에 응답하시겠습니까?"),
      h("p",{class:"muted"},"응답하지 않으셔도 됩니다. '아니요'를 누르면 지금까지의 응답이 제출됩니다."),
      pageMessage ? h("div",{class:"page-msg"},pageMessage) : null
    ));
    setNav(
      h("button",{class:"btn ghost",onclick:()=>prevPage()},"이전"),
      h("button",{class:"btn ghost",id:"optNo",onclick:()=>{ state.l5 = "N"; save(); submit(); }},"아니요"),
      h("button",{class:"btn primary",onclick:()=>{ leavePage(); state.l5 = "Y"; state.pos++; pageMessage = ""; save(); render(); window.scrollTo(0,0); enterPage(); }},"예")
    );
    // '아니요' 버튼이 제출 역할을 하므로 다른 버튼과 같은 너비로
    document.getElementById("optNo").style.flex = "1";
    return;
  }

  const tv = textVersion();
  if (pageMessage) $app.append(h("div",{class:"page-msg",id:"pageMsg"},pageMessage));
  // 모듈 첫 화면 안내(예: L5의 '조직' 뜻). survey_data.json의 module_instructions에서 읽음
  const mi = DATA.module_instructions && DATA.module_instructions[p.module];
  if (mi && mi[tv] && p.key === p.module + "-1") $app.append(h("div",{class:"note",id:"moduleNote"},mi[tv]));
  p.items.forEach((it, idx) => {
    const name = "q_" + it.id;
    const fs = h("fieldset",{class:"scale"}, h("legend",null,it.text[tv]));
    for (let v=1; v<=5; v++){
      const id = name + "_" + v;
      const inp = h("input",{type:"radio",name,id,value:String(v)});
      if (String(state.answers[it.id]) === String(v)) inp.checked = true;
      inp.addEventListener("change", () => {
        state.answers[it.id] = v; save();
        const card = document.getElementById("card_"+it.id);
        if (card) card.classList.remove("missing");
        const bar = document.querySelector(".progress"); if (bar) bar.replaceWith(progressEl());
      });
      fs.append(inp, h("label",{for:id},h("b",null,String(v)),h("span",null,DATA.scale.labels[String(v)])));
    }
    $app.append(h("div",{class:"item",id:"card_"+it.id,"data-item":it.id},
      h("p",{class:"q"},it.text[tv]), fs));
  });

  const nextBtn = h("button",{class:"btn primary",id:"nextBtn",onclick:()=>nextPage()}, isLast ? "제출하기" : "다음");
  setNav(h("button",{class:"btn ghost",onclick:()=>prevPage()},"이전"), nextBtn);
  if (submitting) setSubmitting(true);
}

function markMissing(items){
  const missing = items.filter(it => !state.answers[it.id]);
  missing.forEach(it => { const c = document.getElementById("card_"+it.id); if (c) c.classList.add("missing"); });
  return missing;
}
function nextPage(){
  if (submitting) return;
  const flow = buildFlow(); const p = flow[state.pos];
  const missing = markMissing(p.items);
  if (missing.length){
    let msg = document.getElementById("pageMsg");
    const text = "응답하지 않은 문항이 " + missing.length + "개 있습니다. 표시된 문항에 응답해 주세요.";
    if (!msg){ msg = h("div",{class:"page-msg",id:"pageMsg"}); $app.insertBefore(msg, $app.children[1] || null); }
    msg.textContent = text;
    const first = document.getElementById("card_"+missing[0].id);
    if (first) first.scrollIntoView({behavior:"smooth", block:"center"});
    return;
  }
  if (state.pos === flow.length - 1){ submit(); return; }
  leavePage(); state.pos++; pageMessage = ""; save(); render(); window.scrollTo(0,0); enterPage();
}
function prevPage(){
  if (submitting) return;
  leavePage();
  if (state.pos === 0){ go("guide"); return; }
  const flow = buildFlow();
  // 추가 문항 첫 화면에서 이전 → 선택 화면으로(선택 초기화)
  if (flow[state.pos-1] && flow[state.pos-1].kind === "optask") state.l5 = null;
  state.pos--; pageMessage = ""; save(); render(); window.scrollTo(0,0); enterPage();
}

/* ---------- 제출 ---------- */
function buildRow(){
  const now = Date.now();
  const kind = idKind();
  const secs = {};
  Object.entries(state.pageMs).forEach(([k,ms]) => { secs[k] = Math.round(ms/1000); });
  const row = {
    response_id: state.responseId,
    started_at: kst(state.startedAt || now),
    submitted_at: kst(now),
    duration_sec: Math.round((now - (state.startedAt || now))/1000),
    page_seconds: JSON.stringify(secs),
    school: schoolName(state.school),
    respondent_type: state.type,
    text_version: textVersion(),
    id_number: kind === "phone" ? "" : state.idNumber,
    phone: kind === "phone" ? state.phone : "",
    consent: "Y",
    l5_opt_in: (typeInfo().optional_modules && typeInfo().optional_modules.length) ? (state.l5 || "N") : ""
  };
  const active = new Set(activeModules());
  DATA.items.forEach(it => { row[it.id] = active.has(it.module) && state.answers[it.id] ? Number(state.answers[it.id]) : ""; });
  return row;
}

/* 저장 기능은 이 함수 하나로 분리(2단계에서 다른 저장소로 바꿀 때 여기만 수정) */
async function saveResponse(row){
  if (!CONFIG.SCRIPT_URL){
    await new Promise(r => setTimeout(r, 600));
    window.__lastRow = row; console.log("[테스트 모드] 저장할 행", row);
    return { ok:true, test:true };
  }
  const res = await fetch(CONFIG.SCRIPT_URL, {
    method:"POST", redirect:"follow",
    headers:{ "Content-Type":"text/plain;charset=utf-8" },
    body: JSON.stringify(row)
  });
  if (!res.ok) throw new Error("HTTP " + res.status);
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || "save_failed");
  return j;
}
async function saveWithRetry(row){
  let lastErr;
  for (let attempt = 0; attempt <= CONFIG.RETRY_DELAYS_MS.length; attempt++){
    try { return await saveResponse(row); }
    catch(e){
      lastErr = e;
      if (attempt < CONFIG.RETRY_DELAYS_MS.length){
        const d = CONFIG.RETRY_DELAYS_MS[attempt] * (0.75 + Math.random()*0.5);
        await new Promise(r => setTimeout(r, d));
      }
    }
  }
  throw lastErr;
}
function setSubmitting(on){
  const b = document.getElementById("nextBtn") || document.getElementById("optNo");
  if (!b) return;
  b.disabled = on;
  b.innerHTML = "";
  if (on){ b.append(h("span",{class:"spinner"}), "제출 중…"); }
  else b.textContent = b.id === "optNo" ? "아니요" : "제출하기";
}
async function submit(){
  if (submitting) return;
  // 모든 필수 문항 확인
  const missingId = requiredIds().find(id => !state.answers[id]);
  if (missingId){
    const flow = buildFlow();
    const idx = flow.findIndex(p => p.kind === "items" && p.items.some(i => i.id === missingId));
    leavePage(); state.pos = idx; pageMessage = "응답하지 않은 문항이 있습니다. 표시된 문항에 응답해 주세요.";
    save(); render(); markMissing(flow[idx].items); enterPage(); return;
  }
  leavePage();
  submitting = true; setSubmitting(true);
  const row = buildRow();
  try {
    await saveWithRetry(row);
    submitting = false;
    clearSaved();
    state.step = "done"; render(); window.scrollTo(0,0);
  } catch(e){
    submitting = false; setSubmitting(false);
    enterPage();
    let msg = document.getElementById("pageMsg");
    if (!msg){ msg = h("div",{class:"page-msg",id:"pageMsg"}); $app.insertBefore(msg, $app.children[1] || null); }
    msg.textContent = "제출이 완료되지 않았습니다. 다시 눌러 주세요. (응답은 이 기기에 남아 있습니다)";
    msg.scrollIntoView({behavior:"smooth", block:"center"});
    save();
  }
}

function renderDone(){
  const student = state.type && state.type.startsWith("학생");
  $app.append(h("div",{class:"card center"},
    h("div",{class:"done-icon"},"✓"),
    h("h2",null,"응답이 제출되었습니다"),
    h("p",null,"설문에 참여해 주셔서 감사합니다."),
    student ? h("p",{class:"muted"},"AI 기초 교양과 X+AI 전공 교과를 모두 듣는다면, 다른 수업에서도 한 번 더 응답해 주세요.") : null
  ));
  setNav(h("button",{class:"btn ghost",onclick:()=>{ state = newState(); state._resumeAsked = true; applyUrlParams(); render(); }},"처음 화면으로"));
}

/* 링크로 학교·유형 고정: ?school=yeonsung&type=학생_AI기초
   링크에 들어 있는 항목은 그 하나만 보이고 다른 것으로 바꿀 수 없음 */
const LOCK = { school:null, type:null };
/* 짧은 링크 코드: ?c=y1  (학교 y·i·d + 유형 번호 1~6, 학교만 고정하려면 ?c=y) */
const SHORT_SCHOOL = { y:"yeonsung", i:"inha", d:"dongyang" };
const SHORT_TYPE = { "1":"학생_AI기초", "2":"학생_XAI", "3":"지역주민", "4":"재직자", "5":"교원", "6":"직원" };
function readLock(){
  const q = new URLSearchParams(location.search);
  const c = (q.get("c") || "").toLowerCase();
  if (c){
    if (SHORT_SCHOOL[c[0]]) LOCK.school = SHORT_SCHOOL[c[0]];
    if (c[1] && SHORT_TYPE[c[1]] && DATA.respondent_types[SHORT_TYPE[c[1]]]) LOCK.type = SHORT_TYPE[c[1]];
    return;
  }
  const sc = q.get("school"); if (sc && CONFIG.SCHOOLS.some(s=>s.code===sc)) LOCK.school = sc;
  const ty = q.get("type"); if (ty && DATA.respondent_types[ty]) LOCK.type = ty;
}
function applyUrlParams(){
  if (LOCK.school) state.school = LOCK.school;
  if (LOCK.type) state.type = LOCK.type;
}

/* ---------- 시작 ---------- */
(async function init(){
  if (!CONFIG.SCRIPT_URL) document.getElementById("testbar").hidden = false;
  try {
    const res = await fetch(CONFIG.ITEMS_URL, { cache:"no-cache" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    DATA = await res.json();
  } catch(e){
    $app.innerHTML = "";
    $app.append(h("div",{class:"card"},h("h2",null,"문항을 불러오지 못했습니다"),h("p",null,"잠시 후 새로고침해 주세요. 문제가 계속되면 담당자에게 알려 주세요.")));
    return;
  }
  ITEM_BY_MODULE = {};
  DATA.items.forEach(it => (ITEM_BY_MODULE[it.module] = ITEM_BY_MODULE[it.module] || []).push(it));
  ALL_ITEM_IDS = DATA.items.map(i=>i.id);
  readLock();
  state = newState();
  applyUrlParams();
  render();
})();
</script>
</body>
